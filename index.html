<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EMDR online</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#0b0f14;color:#e8eef4;font:15px/1.35 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
.hidden{display:none!important}
.screen{min-height:100vh}
button,input{font:inherit}
button{border:1px solid #2b3947;background:#151d26;color:#e8eef4;border-radius:10px;padding:10px 14px;cursor:pointer}
button:hover{background:#1d2733}
button:disabled{opacity:.45;cursor:default}
button.primary{background:#19c39a;color:#052018;border-color:transparent;font-weight:700}
button.active{outline:2px solid #19c39a;outline-offset:2px}
input[type=range]{width:100%}
input[type=text]{background:#151d26;border:1px solid #2b3947;color:#e8eef4;border-radius:10px;padding:10px 12px;letter-spacing:.12em;text-transform:uppercase}
input[type=number]{background:#151d26;border:1px solid #2b3947;color:#e8eef4;border-radius:10px;padding:8px 10px;width:84px}
header{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid #202b36;flex-wrap:wrap}
main{display:grid;grid-template-columns:300px 1fr;gap:14px;padding:14px;height:calc(100vh - 56px)}
.controls{display:grid;gap:12px;align-content:start}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 8px}
.stat{background:#151d26;border:1px solid #2b3947;border-radius:10px;padding:8px;text-align:center;display:grid;gap:2px}
.stat b{font-size:20px;color:#19c39a;font-variant-numeric:tabular-nums}
.stat small{font-size:11px}
canvas{display:block;width:100%;height:100%;min-height:280px;background:#000;border:1px solid #202b36;border-radius:12px}
#home{display:grid;place-items:center;padding:20px;text-align:center}
#homeCard{max-width:420px;display:grid;gap:12px}
#client{background:#000}
#clientCanvas{position:fixed;inset:0;width:100vw;height:100vh;border:0;border-radius:0}
#clientTop{position:fixed;left:12px;top:12px;z-index:3;color:#8fa3b5;background:rgba(0,0,0,.45);padding:6px 10px;border-radius:999px;font-size:12px}
#clientExit{position:fixed;right:12px;top:12px;z-index:3;border-radius:999px;width:38px;height:38px;padding:0}
#clientOverlay{position:fixed;inset:0;z-index:4;display:grid;place-items:center;background:rgba(0,0,0,.72);text-align:center;padding:20px}
#clientOverlay button{font-size:18px;padding:16px 22px;border-radius:999px}
small{color:#8fa3b5}
@media(max-width:820px){main{grid-template-columns:1fr;height:auto}canvas{min-height:42vh}}
</style>
</head>
<body>

<div id="home" class="screen">
  <div id="homeCard">
    <h2>EMDR online</h2>
    <small>Терапевт управляет, клиент видит шарик на своём устройстве.</small>
    <button class="primary" id="homeTherapist">Я терапевт</button>
    <div class="grid2">
      <input id="clientCodeInput" type="text" placeholder="КОД" maxlength="6" aria-label="Код сессии">
      <button id="homeClient">Я клиент</button>
    </div>
  </div>
</div>

<div id="therapist" class="screen hidden">
  <header>
    <button id="backHome">←</button>
    <strong>Терапевт</strong>
    <b id="tCode" style="letter-spacing:.12em;color:#19c39a"></b>
    <button id="copyLink">Ссылка</button>
    <span style="margin-left:auto" id="tStatus">…</span>
  </header>

  <main>
    <section class="controls">
      <div>
        <small>Сессия</small>
        <div class="stats">
          <div class="stat"><b id="statTimer">00:00</b><small>Время</small></div>
          <div class="stat"><b id="statPasses">0</b><small>Пасы</small></div>
          <div class="stat"><b id="statSets">0</b><small>Сеты</small></div>
        </div>
        <button id="resetStats" type="button" style="width:100%">Сброс счётчиков</button>
      </div>

      <div>
        <small>Направление</small>
        <div class="grid2" id="patterns">
          <button type="button" data-pattern="lr" class="active">Влево-вправо</button>
          <button type="button" data-pattern="ud">Вверх-вниз</button>
          <button type="button" data-pattern="d1">Диагональ ↘</button>
          <button type="button" data-pattern="d2">Диагональ ↗</button>
        </div>
      </div>

      <label>Скорость: <b id="speedOut">0.60</b> Гц
        <input id="speed" type="range" min="0.2" max="2" step="0.05" value="0.6">
      </label>

      <label>Амплитуда: <b id="ampOut">90</b>%
        <input id="amp" type="range" min="20" max="95" step="1" value="90">
      </label>

      <label><input id="sound" type="checkbox" checked> Звук на границах</label>

      <div>
        <small>Автостоп</small>
        <div class="grid2" id="autoMode">
          <button type="button" data-auto="passes" class="active">По пасам</button>
          <button type="button" data-auto="secs">По секундам</button>
        </div>
        <label style="display:block;margin-top:8px">Через
          <input id="autoValue" type="number" min="1" step="1" value="10">
          <b id="autoUnit">пасов</b>
        </label>
        <label style="display:block;margin-top:8px"><input id="autoOn" type="checkbox"> Остановить автоматически</label>
      </div>

      <div class="grid2">
        <button class="primary" id="start">Старт</button>
        <button id="pause">Пауза</button>
        <button id="stop">Стоп</button>
        <button id="testSound">Тест звука</button>
      </div>

      <small>Space — старт/пауза, Esc — стоп.</small>
    </section>

    <canvas id="preview"></canvas>
  </main>
</div>

<div id="client" class="screen hidden">
  <canvas id="clientCanvas"></canvas>
  <div id="clientTop">подключение…</div>
  <button id="clientExit" title="Выйти">×</button>
  <div id="clientOverlay">
    <div>
      <button class="primary" id="clientStart">Включить звук и полный экран</button>
      <p><small>Нужно одно касание: браузер разрешает звук только после действия.</small></p>
    </div>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const screens = ['home','therapist','client'];
  const ALPH = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  const newCode = () => Array.from({length:6}, () => ALPH[Math.random()*ALPH.length|0]).join('');

  const state = {
    pattern:'lr',
    speed:0.6,
    amp:0.9,
    sound:true,
    running:false,
    epoch:0,
    phase:0,
    stopAt:0,
    code:''
  };

  const STOP_DUR = 500;

  const SUPABASE_URL = 'https://typkcfrafaooupxjpfvx.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_5qagXHVKM5fO-VXxCN6Z3Q_jUZIw2b5';

  let mode = 'home';
  let sb = null;
  let channel = null;
  let offset = 0;
  let prevHalf = null;
  let netRole = '';
  let netCode = '';
  let timeTimer = 0;
  let stateTimer = 0;
  let audioCtx = null;

  let statsTime = 0;
  let statPasses = 0;
  let statSets = 0;
  let setActive = false;
  let autoMode = 'passes';
  let autoValue = 10;
  let autoEnabled = false;
  let prevPhase = null;
  let lastTick = 0;
  let lastTimerText = '';
  let lastPassesText = -1;
  let lastSetsText = -1;

  function fmtTime(ms){
    const total = Math.floor(ms / 1000);
    const m = Math.floor(total / 60);
    const s = total % 60;
    return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  }

  function renderStats(){
    const t = fmtTime(statsTime);
    if(t !== lastTimerText){ $('statTimer').textContent = t; lastTimerText = t; }
    if(statPasses !== lastPassesText){ $('statPasses').textContent = statPasses; lastPassesText = statPasses; }
    if(statSets !== lastSetsText){ $('statSets').textContent = statSets; lastSetsText = statSets; }
  }

  function resetStats(){
    statsTime = 0;
    statPasses = 0;
    statSets = 0;
    lastTimerText = '';
    lastPassesText = -1;
    lastSetsText = -1;
    renderStats();
  }

  function stopFactor(t){
    if(!state.stopAt) return 1;
    return Math.max(0, Math.min(1, 1 - (t - state.stopAt) / STOP_DUR));
  }

  function checkAutoStop(){
    if(!autoEnabled || !state.running || autoValue <= 0) return;
    if(autoMode === 'passes'){
      if(statPasses >= autoValue) stop();
    } else {
      if(statsTime >= autoValue * 1000) stop();
    }
  }

  function show(name){
    mode = name;
    screens.forEach(s => $(s).classList.toggle('hidden', s !== name));
    if(name === 'client') $('clientOverlay').classList.remove('hidden');
  }

  function setTStatus(t){ $('tStatus').textContent = t; }
  function setCStatus(t){ $('clientTop').textContent = t; }

  function parseHash(){
    const raw = location.hash.replace(/^#\/?/, '');
    const parts = raw.split('/');
    return {
      role: parts[0] || '',
      code: (parts[1] || '').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6)
    };
  }

  function route(){
    const { role, code } = parseHash();

    if(role === 't'){
      state.code = code || localStorage.getItem('emdrOnlineCode') || newCode();
      localStorage.setItem('emdrOnlineCode', state.code);

      const target = '#/t/' + state.code;
      if(location.hash !== target) history.replaceState(null, '', target);

      show('therapist');
      syncUI();
      ensureTherapistNet();
    } else if(role === 'c' && code){
      state.code = code;
      show('client');
      ensureClientNet();
    } else {
      show('home');
      cleanupNet();
    }
  }

  function syncUI(){
    $('tCode').textContent = state.code || '';
    $('speedOut').textContent = state.speed.toFixed(2);
    $('ampOut').textContent = Math.round(state.amp * 100);
    $('speed').value = state.speed;
    $('amp').value = Math.round(state.amp * 100);
    $('sound').checked = state.sound;

    document.querySelectorAll('#patterns button').forEach(b => {
      b.classList.toggle('active', b.dataset.pattern === state.pattern);
    });

    $('start').disabled = state.running;
    $('pause').disabled = !state.running;
  }

  function mod1(x){ return ((x % 1) + 1) % 1; }

  function currentPhase(){
    if(!state.running) return state.phase;
    return mod1(((Date.now() - state.epoch) / 1000) * state.speed);
  }

  function clientPhase(){
    if(!state.running) return state.phase;
    return mod1((((Date.now() + offset) - state.epoch) / 1000) * state.speed);
  }

  function setPattern(p){
    state.pattern = p;
    prevHalf = null;
    sendState();
    syncUI();
  }

  function setSpeed(v){
    const ph = currentPhase();
    state.speed = v;

    if(state.running){
      state.epoch = Date.now() - (ph / v) * 1000;
    } else {
      state.phase = ph;
    }

    sendState();
    syncUI();
  }

  function start(){
    if(state.running) return;
    state.epoch = Date.now();
    state.running = true;
    state.stopAt = 0;
    setActive = true;
    prevHalf = null;
    sendState();
    syncUI();
  }

  function pause(){
    if(!state.running) return;
    state.phase = currentPhase();
    state.running = false;
    prevHalf = null;
    sendState();
    syncUI();
  }

  function stop(){
    state.phase = currentPhase();
    state.stopAt = Date.now();
    state.running = false;
    prevHalf = null;

    if(setActive){ statSets++; setActive = false; }
    statsTime = 0;
    statPasses = 0;

    sendState();
    syncUI();
  }

  function snapshot(){
    return {
      pattern: state.pattern,
      speed: state.speed,
      amp: state.amp,
      sound: state.sound,
      running: state.running,
      epoch: state.epoch,
      phase: state.phase,
      stopAt: state.stopAt
    };
  }

  function sendState(){
    if(mode !== 'therapist' || !channel) return;
    try{
      channel.send({ type: 'broadcast', event: 'state', payload: snapshot() });
    }catch(e){}
  }

  function cleanupNet(){
    clearInterval(timeTimer);
    clearInterval(stateTimer);
    timeTimer = stateTimer = 0;

    if(channel && sb){
      try{ sb.removeChannel(channel); }catch(e){}
    }
    channel = null;

    netRole = '';
    netCode = '';
    offset = 0;
    prevHalf = null;
  }

  function ensureTherapistNet(){
    if(!sb){
      setTStatus('Supabase не настроен');
      return;
    }
    if(netRole === 't' && netCode === state.code) return;

    cleanupNet();
    netRole = 't';
    netCode = state.code;
    host();
  }

  function ensureClientNet(){
    if(!sb){
      setCStatus('Supabase не настроен');
      return;
    }
    if(netRole === 'c' && netCode === state.code) return;

    cleanupNet();
    netRole = 'c';
    netCode = state.code;
    join();
  }

  function refreshNet(){
    if(mode === 'therapist') ensureTherapistNet();
    if(mode === 'client') ensureClientNet();
  }

  function channelName(){
    return 'emdr-' + state.code;
  }

  function countPresence(role){
    if(!channel) return 0;
    const st = channel.presenceState();
    let n = 0;
    Object.keys(st).forEach(k => {
      st[k].forEach(p => { if(p.role === role) n++; });
    });
    return n;
  }

  function host(){
    if(!sb) return;

    setTStatus('подключение…');

    channel = sb.channel(channelName(), {
      config: {
        broadcast: { self: false },
        presence: { key: 'therapist' }
      }
    });

    channel.on('broadcast', { event: 'hello' }, () => sendState());

    channel.on('broadcast', { event: 'timeReq' }, ({ payload }) => {
      const now = Date.now();
      try{
        channel.send({
          type: 'broadcast',
          event: 'timeResp',
          payload: { t1: payload && payload.t1, t2: now, t3: now }
        });
      }catch(e){}
    });

    channel.on('presence', { event: 'sync' }, () => {
      const n = countPresence('client');
      setTStatus(n ? ('клиентов: ' + n) : 'ожидание клиента');
    });

    channel.subscribe(status => {
      if(status === 'SUBSCRIBED'){
        try{ channel.track({ role: 'therapist' }); }catch(e){}
        setTStatus('ожидание клиента');
        sendState();
      } else if(status === 'CHANNEL_ERROR' || status === 'TIMED_OUT'){
        setTStatus('нет связи с сервером');
      }
    });

    stateTimer = setInterval(sendState, 2000);
  }

  function join(){
    if(!sb) return;

    setCStatus('подключение…');

    channel = sb.channel(channelName(), {
      config: {
        broadcast: { self: false },
        presence: { key: 'client-' + Math.random().toString(36).slice(2, 8) }
      }
    });

    channel.on('broadcast', { event: 'state' }, ({ payload }) => {
      if(!payload) return;
      Object.assign(state, payload);
      prevHalf = null;
      setCStatus(state.running ? 'движение' : 'пауза');
    });

    channel.on('broadcast', { event: 'timeResp' }, ({ payload }) => {
      if(!payload) return;
      const t4 = Date.now();
      offset = ((payload.t2 - payload.t1) + (payload.t3 - t4)) / 2;
    });

    channel.on('presence', { event: 'sync' }, () => {
      setCStatus(countPresence('therapist') ? 'связь есть' : 'ждём терапевта…');
    });

    channel.subscribe(status => {
      if(status === 'SUBSCRIBED'){
        try{ channel.track({ role: 'client' }); }catch(e){}
        try{ channel.send({ type: 'broadcast', event: 'hello', payload: {} }); }catch(e){}
        setCStatus('ждём терапевта…');

        clearInterval(timeTimer);
        timeTimer = setInterval(() => {
          try{
            channel.send({ type: 'broadcast', event: 'timeReq', payload: { t1: Date.now() } });
          }catch(e){}
        }, 3000);
      } else if(status === 'CHANNEL_ERROR' || status === 'TIMED_OUT'){
        setCStatus('нет связи с сервером');
      } else if(status === 'CLOSED'){
        setCStatus('связь закрыта');
      }
    });
  }

  function ensureAudio(){
    if(!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(AC) audioCtx = new AC();
    }
    if(audioCtx && audioCtx.state === 'suspended'){
      audioCtx.resume();
    }
  }

  function beep(panValue){
    if(!state.sound || !audioCtx) return;

    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = 'sine';
    osc.frequency.setValueAtTime(1200, t);

    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.18, t + 0.004);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.08);

    let tail = gain;

    if(audioCtx.createStereoPanner){
      const pan = audioCtx.createStereoPanner();
      pan.pan.value = Math.max(-1, Math.min(1, panValue * 0.8));
      gain.connect(pan);
      tail = pan;
    }

    osc.connect(gain);
    tail.connect(audioCtx.destination);

    osc.start(t);
    osc.stop(t + 0.09);
  }

  function pos(p){
    const s = Math.sin(Math.PI * 2 * p);

    if(state.pattern === 'ud') return { x: 0, y: -s };
    if(state.pattern === 'd1') return { x: -s, y: -s };
    if(state.pattern === 'd2') return { x: -s, y: s };

    return { x: -s, y: 0 };
  }

  function fit(canvas){
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const r = canvas.getBoundingClientRect();
    const w = Math.max(1, r.width);
    const h = Math.max(1, r.height);

    const cw = Math.round(w * dpr);
    const ch = Math.round(h * dpr);

    if(canvas.width !== cw || canvas.height !== ch){
      canvas.width = cw;
      canvas.height = ch;
    }

    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    return { ctx, w, h };
  }

  function draw(canvas, phase, makeSound, factor){
    const { ctx, w, h } = fit(canvas);
    const k = factor === undefined ? 1 : factor;

    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, w, h);

    const r = Math.min(w, h) * 0.04;
    const pad = r * 1.5;

    const p = pos(phase);
    const x = w / 2 + p.x * state.amp * k * (w / 2 - pad);
    const y = h / 2 + p.y * state.amp * k * (h / 2 - pad);

    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.strokeRect(pad, pad, w - pad * 2, h - pad * 2);

    const g = ctx.createRadialGradient(
      x - r * 0.3,
      y - r * 0.3,
      r * 0.1,
      x,
      y,
      r
    );
    g.addColorStop(0, '#fff');
    g.addColorStop(1, '#d7dee5');

    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();

    if(makeSound && state.running && state.sound){
      const half = Math.floor(phase * 2 + 0.5) % 2;

      if(prevHalf !== null && half !== prevHalf){
        beep(p.x);
      }

      prevHalf = half;
    } else {
      prevHalf = null;
    }
  }

  function loop(){
    requestAnimationFrame(loop);

    if(mode === 'therapist'){
      const now = Date.now();

      if(state.running){
        if(lastTick) statsTime += now - lastTick;

        const ph = currentPhase();
        if(prevPhase !== null && ph < prevPhase) statPasses++;
        prevPhase = ph;

        checkAutoStop();
      } else {
        prevPhase = null;
      }

      lastTick = now;

      draw($('preview'), currentPhase(), false, stopFactor(now));
      renderStats();
    } else {
      lastTick = 0;
    }

    if(mode === 'client'){
      draw($('clientCanvas'), clientPhase(), true, stopFactor(Date.now() + offset));
    }
  }

  function activateClient(){
    ensureAudio();
    $('clientOverlay').classList.add('hidden');

    if(document.documentElement.requestFullscreen && !document.fullscreenElement){
      document.documentElement.requestFullscreen().catch(() => {});
    }
  }

  $('homeTherapist').addEventListener('click', () => {
    location.hash = '#/t';
  });

  $('homeClient').addEventListener('click', () => {
    const code = $('clientCodeInput').value
      .toUpperCase()
      .replace(/[^A-Z0-9]/g, '')
      .slice(0, 6);

    if(code) location.hash = '#/c/' + code;
  });

  $('clientCodeInput').addEventListener('input', e => {
    e.target.value = e.target.value
      .toUpperCase()
      .replace(/[^A-Z0-9]/g, '')
      .slice(0, 6);
  });

  $('backHome').addEventListener('click', () => {
    location.hash = '';
  });

  $('copyLink').addEventListener('click', async () => {
    const link = location.href.split('#')[0] + '#/c/' + state.code;

    try{
      await navigator.clipboard.writeText(link);
      $('copyLink').textContent = 'Скопировано';
      setTimeout(() => $('copyLink').textContent = 'Ссылка', 1200);
    }catch(e){
      prompt('Ссылка для клиента:', link);
    }
  });

  $('patterns').addEventListener('click', e => {
    const b = e.target.closest('button[data-pattern]');
    if(b) setPattern(b.dataset.pattern);
  });

  $('speed').addEventListener('input', e => {
    setSpeed(parseFloat(e.target.value));
  });

  $('amp').addEventListener('input', e => {
    state.amp = parseInt(e.target.value, 10) / 100;
    sendState();
    syncUI();
  });

  $('sound').addEventListener('change', e => {
    state.sound = e.target.checked;
    sendState();
  });

  $('autoMode').addEventListener('click', e => {
    const b = e.target.closest('button[data-auto]');
    if(!b) return;
    autoMode = b.dataset.auto;
    document.querySelectorAll('#autoMode button').forEach(x => x.classList.toggle('active', x === b));
    $('autoUnit').textContent = autoMode === 'passes' ? 'пасов' : 'секунд';
  });

  $('autoValue').addEventListener('input', e => {
    autoValue = parseInt(e.target.value, 10) || 0;
  });

  $('autoOn').addEventListener('change', e => {
    autoEnabled = e.target.checked;
  });

  $('start').addEventListener('click', start);
  $('pause').addEventListener('click', pause);
  $('stop').addEventListener('click', stop);
  $('resetStats').addEventListener('click', resetStats);

  $('testSound').addEventListener('click', () => {
    ensureAudio();
    beep(0);
  });

  $('clientStart').addEventListener('click', activateClient);
  $('clientExit').addEventListener('click', () => {
    location.hash = '';
  });

  window.addEventListener('hashchange', route);

  window.addEventListener('keydown', e => {
    if(mode === 'therapist' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){
      if(e.code === 'Space'){
        e.preventDefault();
        state.running ? pause() : start();
      }

      if(e.key === 'Escape'){
        stop();
      }
    }

    if(mode === 'client' && e.code === 'Space'){
      e.preventDefault();
      activateClient();
    }
  });

  function loadScript(src){
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = src;
      s.async = true;
      s.onload = resolve;
      s.onerror = () => reject(new Error(src));
      document.head.appendChild(s);
    });
  }

  function connectNet(){
    if(!window.supabase || !window.supabase.createClient){
      if(mode === 'therapist') setTStatus('клиент Supabase не загрузился');
      if(mode === 'client') setCStatus('клиент Supabase не загрузился');
      return;
    }

    if(!SUPABASE_URL || SUPABASE_URL.indexOf('YOUR_') === 0 ||
       !SUPABASE_KEY || SUPABASE_KEY.indexOf('YOUR_') === 0){
      if(mode === 'therapist') setTStatus('укажите SUPABASE_URL и SUPABASE_KEY');
      if(mode === 'client') setCStatus('Supabase не настроен');
      return;
    }

    try{
      sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
        realtime: { params: { eventsPerSecond: 20 } }
      });
    }catch(e){
      sb = null;
    }

    refreshNet();
  }

  loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js')
    .catch(() => loadScript('https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js'))
    .catch(() => loadScript('./supabase.js'))
    .then(connectNet, connectNet);

  route();
  syncUI();
  loop();
})();
</script>

</body>
</html>
